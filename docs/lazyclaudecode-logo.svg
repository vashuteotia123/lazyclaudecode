<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="lazyclaudecode">
  <rect x="1" y="1" width="718" height="198" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- A session with one abandoned branch and one live branch -->
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 52 V148" stroke="#3fb950"/>
    <path d="M92 96 C92 122 136 112 136 140" stroke="#6e7681"/>
  </g>
  <circle cx="92" cy="52" r="10" fill="#c9d1d9"/>
  <circle cx="92" cy="96" r="10" fill="#d29922"/>
  <circle cx="136" cy="146" r="9" fill="#0d1117" stroke="#6e7681" stroke-width="5"/>
  <circle cx="92" cy="148" r="11" fill="#3fb950"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="188" y="104" font-size="56" font-weight="700" letter-spacing="-1"><tspan fill="#c9d1d9">lazy</tspan><tspan fill="#3fb950">claude</tspan><tspan fill="#c9d1d9">code</tspan></text>
    <text x="190" y="142" font-size="19" fill="#8b949e">every Claude Code session, every branch</text>
  </g>
</svg>
